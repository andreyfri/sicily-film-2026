<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111923"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Моя киностудия"><title>Моя киностудия</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#10151c;color:#f2f5f8}header{position:sticky;top:0;background:#202b36;padding:16px;z-index:5;border-bottom:1px solid #384554}h1{font-size:23px;margin:0 0 5px}.sub{color:#b8c8d4;font-size:13px}main{max-width:850px;margin:auto;padding:16px}button,input,textarea{font:inherit}button{border:0;border-radius:9px;background:#3d627d;color:white;padding:10px 13px;cursor:pointer}button.secondary{background:#374553}button.danger{background:#693b44}button.small{padding:7px 10px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.card{background:#1c2530;border:1px solid #354454;border-radius:13px;padding:15px;margin-bottom:13px}.card h2{font-size:19px;margin:0 0 8px}.card p{white-space:pre-wrap;color:#c2d0dc;font-size:14px}.progress{height:7px;background:#364552;border-radius:10px;overflow:hidden;margin:12px 0 5px}.progress>div{height:100%;background:#50c6a8}.item{background:#25313e;border:1px solid #40505e;border-radius:10px;padding:12px;margin:10px 0}.item label{display:flex;align-items:center;gap:9px;font-weight:600}.item input[type=checkbox]{width:20px;height:20px;accent-color:#50c6a8}.item p{margin:8px 0;white-space:pre-wrap;color:#bdcbd6;font-size:13px}.done{text-decoration:line-through;opacity:.65}.section{font-weight:700;margin:18px 0 8px;color:#d3e7f2}details>summary{cursor:pointer;list-style:none}details>summary::-webkit-details-marker{display:none}.inside{padding-top:12px}.back{margin-bottom:14px}dialog{background:#202b36;color:white;border:1px solid #607487;border-radius:14px;width:min(92vw,550px)}dialog::backdrop{background:#000b}dialog label{display:block;margin:10px 0 5px}dialog input,dialog textarea{width:100%;padding:11px;background:#111a23;border:1px solid #56687a;border-radius:8px;color:white}dialog textarea{min-height:100px}.refs a{color:#b4dfff;overflow-wrap:anywhere}.refs img{max-width:170px;max-height:120px}.refs video{max-width:220px}footer{padding:20px;color:#9aafbd;font-size:12px;max-width:850px;margin:auto}
</style></head><body><header><h1>🎬 Моя киностудия</h1><div class="sub" id="subtitle">Все фильмы в одном месте</div><div class="actions" id="topActions"></div></header><main id="app"></main><footer>Данные сохраняются в браузере этого устройства. Для резервной копии используйте «Экспорт JSON». Облачная синхронизация пока не подключена.</footer>
<dialog id="editor"><form method="dialog" onsubmit="return false"><h2 id="editTitle">Редактировать</h2><label>Название<input id="editName"></label><label>Описание / параметры<textarea id="editInfo"></textarea></label><div class="actions"><button type="button" onclick="saveEdit()">Сохранить</button><button type="button" class="secondary" onclick="editor.close()">Отмена</button></div></form></dialog><input type="file" id="import" accept=".json,application/json" hidden onchange="importData(event)"><script>
const initialSicily=[{"name":"Катания. Между ночью и утром","info":"26 ноября · аэропорт Катании · примерно 02:00–05:00 · трое путешественников, без чемоданов и пледов · длина сцены 30–40 секунд","shots":[{"name":"Часы в аэропорту","info":"Крупный план · Fuji X-S20 · 50–80 мм · неподвижно · ночной пресет C2","done":false,"refs":[]},{"name":"Надпись Catania","info":"Средний/общий план · 16–35 мм · статично · C2","done":false,"refs":[]},{"name":"Трое путешественников на скамейках","info":"Общий план · 16 мм · статично · естественное ночное освещение","done":false,"refs":[]},{"name":"Усталость: лица, руки, детали","info":"Крупные планы · 50–80 мм · очень плавное движение","done":false,"refs":[]},{"name":"Первые признаки утра","info":"Общий план · 16–35 мм · статично","done":false,"refs":[]}],"sounds":[{"name":"Атмосфера ночного аэропорта","info":"20–30 секунд чистого фонового звука; Deity D4 Duo по ситуации","done":false},{"name":"Объявления по громкой связи","info":"Отдельный чистый фрагмент","done":false},{"name":"Шаги и движение людей","info":"10–20 секунд","done":false}]},{"name":"Ачи-Трецца. Рассвет у скал Циклопов","info":"27 ноября · подготовка около 06:15 · DJI Osmo Action 5 Pro · таймлапс 06:30–07:00 · интервал 1 секунда · 25 fps","shots":[{"name":"Рассветный таймлапс","info":"Osmo Action 5 Pro · фиксированная камера · интервал 1 сек · 06:30–07:00","done":false,"refs":[]}],"sounds":[{"name":"Утренний прибой","info":"Записать отдельно 30 секунд","done":false}]},{"name":"Аранчини и скалы Циклопов","info":"Кафе после рассвета · связать аранчини по форме со скалами","shots":[{"name":"Аранчини на фоне скал","info":"Средний и крупный план · композиционное совпадение","done":false,"refs":[]}],"sounds":[{"name":"Звуки кафе","info":"Кофейные чашки, разговоры, атмосфера","done":false}]},{"name":"Рынок Катании. Фрукты в руке","info":"Серия коротких кадров по 2–3 секунды, одинаковая дистанция и композиция","shots":[{"name":"Фрукт перед камерой","info":"Fuji X-S20 · 16 мм · глаза по правилу третей · смена фруктов в монтаже","done":false,"refs":[]}],"sounds":[{"name":"Шум рынка","info":"Голоса продавцов, торг, шаги","done":false}]},{"name":"Рыбный рынок и ужин","info":"Пятница — рыба-меч; суббота — групер; приготовление в квартире","shots":[{"name":"Выбор рыбы на рынке","info":"Детали прилавка, руки продавца, рыба","done":false,"refs":[]},{"name":"Приготовление ужина","info":"Крупные планы ингредиентов и готового блюда","done":false,"refs":[]}],"sounds":[{"name":"Атмосфера рыбного рынка","info":"Голоса и звук торговли","done":false},{"name":"Звуки кухни","info":"Нож, сковорода, посуда","done":false}]}];
const KEY='my_film_studio_v1',OLD='sicily_shoot_v1';
let projects;
try{projects=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(projects))throw Error()}catch(e){let old;try{old=JSON.parse(localStorage.getItem(OLD))}catch(e){};projects=[{id:'sicily',name:'Сицилия',info:'26–29 ноября 2026',scenes:Array.isArray(old)?old:initialSicily},{id:'georgia',name:'Новый год в Грузии',info:'Новый съёмочный проект',scenes:[]}]}
let active=null,ctx=null;const app=document.getElementById('app'),topActions=document.getElementById('topActions'),editor=document.getElementById('editor');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&#39;'}[c]))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(projects))}catch(e){alert('Не удалось сохранить: память браузера заполнена. Экспортируйте JSON и уменьшите вложения.')}}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function project(){return projects.find(p=>p.id===active)}function progress(p){let items=p.scenes.flatMap(s=>[...s.shots,...s.sounds]);return [items.filter(x=>x.done).length,items.length]}
function bar(p){let [done,total]=progress(p);return `<div class="progress"><div style="width:${total?done/total*100:0}%"></div></div><div class="sub">Выполнено ${done} из ${total}</div>`}
function render(){let p=project();document.getElementById('subtitle').textContent=p?p.name:'Все фильмы в одном месте';topActions.innerHTML=p?btn('← Все фильмы','goHome()','secondary')+btn('+ Сцена','addScene()')+btn('Экспорт JSON','exportData()','secondary')+btn('Импорт JSON',"document.getElementById('import').click()",'secondary'):btn('+ Новый фильм','addProject()')+btn('Экспорт JSON','exportData()','secondary')+btn('Импорт JSON',"document.getElementById('import').click()",'secondary');
if(!p){app.innerHTML=projects.map(x=>`<div class="card"><h2>${esc(x.name)}</h2><p>${esc(x.info)}</p><div class="sub">${x.scenes.length} сцен</div>${bar(x)}<div class="actions">${btn('Открыть',`openProject('${x.id}')`)}${btn('Изменить',`editProject('${x.id}')`,'secondary')}${btn('Удалить',`removeProject('${x.id}')`,'danger small')}</div></div>`).join('')||'<p>Пока нет фильмов.</p>';return}
app.innerHTML=p.scenes.map((s,si)=>`<div class="card"><details ${si===0?'open':''}><summary><h2>Сцена ${si+1}. ${esc(s.name)}</h2><p>${esc(s.info)}</p></summary><div class="inside"><div class="actions">${btn('Изменить сцену',`editScene(${si})`,'secondary small')}${btn('Удалить сцену',`removeScene(${si})`,'danger small')}</div><div class="section">🎥 Видео · ${s.shots.length} кадров</div>${s.shots.map((x,i)=>item(x,si,'shots',i)).join('')}${btn('+ Добавить кадр',`addItem(${si},'shots')`,'small')}<div class="section">🎙 Звук · ${s.sounds.length} записей</div>${s.sounds.map((x,i)=>item(x,si,'sounds',i)).join('')}${btn('+ Добавить звук',`addItem(${si},'sounds')`,'small')}</div></details></div>`).join('')||'<div class="card">Пока нет сцен. Нажми «+ Сцена», чтобы начать.</div>'}
function item(x,si,t,i){let refs=t==='shots'?`<div class="refs">${(x.refs||[]).map((r,j)=>`<div>${r.kind==='url'?`<a href="${esc(r.data)}" target="_blank" rel="noopener noreferrer">${esc(r.name||r.data)}</a>`:r.kind==='image'?`<img src="${r.data}" alt="${esc(r.name)}">`:r.kind==='video'?`<video src="${r.data}" controls></video>`:`<a href="${r.data}" download="${esc(r.name)}">${esc(r.name)}</a>`} ${btn('×',`delRef(${si},${i},${j})`,'small secondary')}</div>`).join('')}</div><div class="actions">${btn('🔗 Ссылка',`addLink(${si},${i})`,'small secondary')}${btn('📎 Фото / видео',`document.getElementById('file-${si}-${i}').click()`,'small secondary')}<input type="file" id="file-${si}-${i}" accept="image/*,video/*,audio/*" multiple hidden onchange="addFiles(event,${si},${i})"></div>`:'';return `<div class="item"><label><input type="checkbox" ${x.done?'checked':''} onchange="toggle(${si},'${t}',${i},this.checked)"><span class="${x.done?'done':''}">${i+1}. ${esc(x.name)}</span></label><p>${esc(x.info)}</p>${refs}<div class="actions">${btn('Изменить',`editItem(${si},'${t}',${i})`,'small secondary')}${btn('Удалить',`removeItem(${si},'${t}',${i})`,'small danger')}</div></div>`}
function goHome(){active=null;render()}function openProject(id){active=id;render()}function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function addProject(){let p={id:uid(),name:'Новый фильм',info:'',scenes:[]};projects.push(p);save();editProject(p.id)}
function editProject(id){ctx={kind:'project',id};openEditor('Фильм',projects.find(p=>p.id===id))}
function removeProject(id){if(confirm('Удалить фильм со всеми сценами? Сначала рекомендуется экспортировать JSON.')){projects=projects.filter(p=>p.id!==id);save();render()}}
function addScene(){let p=project();p.scenes.push({name:'Новая сцена',info:'',shots:[],sounds:[]});save();editScene(p.scenes.length-1)}
function editScene(si){ctx={kind:'scene',si};openEditor('Сцена',project().scenes[si])}
function removeScene(si){if(confirm('Удалить сцену?')){project().scenes.splice(si,1);save();render()}}
function addItem(si,t){let a=project().scenes[si][t];a.push({name:t==='shots'?'Новый кадр':'Новый звук',info:'',done:false,...(t==='shots'?{refs:[]}:{})});save();editItem(si,t,a.length-1)}
function editItem(si,t,i){ctx={kind:'item',si,t,i};openEditor(t==='shots'?'Кадр':'Звук',project().scenes[si][t][i])}
function removeItem(si,t,i){if(confirm('Удалить пункт?')){project().scenes[si][t].splice(i,1);save();render()}}
function openEditor(title,o){document.getElementById('editTitle').textContent=title;document.getElementById('editName').value=o.name;document.getElementById('editInfo').value=o.info||'';editor.showModal()}
function saveEdit(){let o=ctx.kind==='project'?projects.find(p=>p.id===ctx.id):ctx.kind==='scene'?project().scenes[ctx.si]:project().scenes[ctx.si][ctx.t][ctx.i];o.name=document.getElementById('editName').value.trim()||'Без названия';o.info=document.getElementById('editInfo').value;save();editor.close();render()}
function toggle(si,t,i,v){project().scenes[si][t][i].done=v;save();render()}
function addLink(si,i){let url=prompt('Вставь ссылку https://...');if(!url)return;try{let u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw Error();let x=project().scenes[si].shots[i];(x.refs||(x.refs=[])).push({kind:'url',data:url,name:url});save();render()}catch(e){alert('Нужна ссылка http или https')}}
function delRef(si,i,j){project().scenes[si].shots[i].refs.splice(j,1);save();render()}
async function addFiles(e,si,i){let x=project().scenes[si].shots[i];for(let f of e.target.files){if(f.size>5*1024*1024){alert('Файл больше 5 МБ — используй ссылку');continue}let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});(x.refs||(x.refs=[])).push({kind:f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'file',name:f.name,data})}save();render()}
function exportData(){let blob=new Blob([JSON.stringify({version:1,projects},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-film-studio-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
async function importData(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text()),incoming=Array.isArray(obj)?[{id:'sicily',name:'Сицилия',info:'26–29 ноября 2026',scenes:obj}]:obj.projects;if(!Array.isArray(incoming)||!incoming.every(p=>typeof p.name==='string'&&Array.isArray(p.scenes)&&p.scenes.every(s=>Array.isArray(s.shots)&&Array.isArray(s.sounds))))throw Error();if(confirm('Импорт заменит текущие фильмы. Продолжить?')){projects=incoming.map(p=>({...p,id:p.id||uid()}));active=null;save();render()}}catch(err){alert('Неправильный файл JSON')}e.target.value=''}
save();render();
</script></body></html>
