<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сицилия — съёмочный план</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}body{background:#10151c;color:#f3f5f7;margin:0}header{background:#202b36;padding:18px 16px;position:sticky;top:0;z-index:2}h1{font-size:23px;margin:0 0 4px}.muted{color:#aebac8;font-size:13px}main{max-width:850px;margin:auto;padding:16px}button,input,textarea{font:inherit}button{border:0;border-radius:9px;padding:9px 13px;background:#3d627d;color:#fff;cursor:pointer}button.alt{background:#37404b}.topactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}article{background:#1c2530;border:1px solid #35404b;border-radius:14px;margin:0 0 14px;overflow:hidden}article>summary{padding:16px;cursor:pointer}details>summary{cursor:pointer}h2{font-size:19px;margin:0 0 7px}.inside{padding:0 14px 14px}.sectiontitle{font-weight:700;color:#cddfea;margin:17px 0 10px}.item{border:1px solid #394753;border-radius:10px;padding:12px;margin:10px 0;background:#232e3a}.itemhead{display:flex;gap:9px;align-items:center}.itemhead strong{flex:1}.item input[type=checkbox]{width:19px;height:19px;accent-color:#51c3aa}.meta{color:#c0cbd4;font-size:13px;margin:8px 0;white-space:pre-wrap}.refs a{display:inline-block;color:#a9d9ff;margin:4px 8px 4px 0;word-break:break-all}.refs img{max-width:160px;max-height:110px;border-radius:7px;margin:5px}.refs video{max-width:220px;margin:5px}label{display:block;margin:10px 0 4px}input[type=text],input[type=url],textarea{box-sizing:border-box;width:100%;padding:10px;background:#121a22;color:white;border:1px solid #4b5b6b;border-radius:8px}textarea{min-height:65px}dialog{background:#202a35;color:white;border:1px solid #64798a;border-radius:14px;width:min(90%,540px)}dialog::backdrop{background:#000b}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.small{font-size:12px;padding:7px 9px}.done strong{text-decoration:line-through;opacity:.65}.bar{height:6px;background:#34404a;border-radius:10px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#4fc7a7}.footer{padding:18px;font-size:12px;color:#aebac8}input[type=file]{max-width:100%}</style></head><body><header><h1>🎬 Сицилия — съёмочный план</h1><div class="muted">26–29 ноября 2026 · Видео и звук — отдельные чек-листы</div><div class="topactions"><button onclick="addScene()">+ Сцена</button><button class="alt" onclick="exportData()">Экспорт JSON</button><button class="alt" onclick="document.getElementById('import').click()">Импорт JSON</button><input id="import" type="file" accept="application/json" hidden onchange="importData(event)"></div></header><main id="app"></main><div class="footer">Данные сохраняются только в браузере этого устройства. Для переноса на другое устройство используйте экспорт. Большие видео лучше прикреплять ссылкой; файлы могут превысить лимит памяти браузера.</div><dialog id="editor"><form method="dialog" onsubmit="return false"><h2 id="editTitle">Редактирование</h2><label>Название<input id="name" type="text"></label><label>Описание / параметры<textarea id="info"></textarea></label><div class="actions"><button type="button" onclick="saveEdit()">Сохранить</button><button type="button" class="alt" onclick="document.getElementById('editor').close()">Отмена</button></div></form></dialog><script>
const initial=[{name:'Катания. Между ночью и утром',info:'26 ноября · аэропорт Катании · примерно 02:00–05:00 · трое путешественников, без чемоданов и пледов · длина сцены 30–40 секунд',shots:[['Часы в аэропорту','Крупный план · Fuji X-S20 · 50–80 мм · неподвижно · ночной пресет C2'],['Надпись Catania','Средний/общий план · 16–35 мм · статично · C2'],['Трое путешественников на скамейках','Общий план · 16 мм · статично · естественное ночное освещение'],['Усталость: лица, руки, детали','Крупные планы · 50–80 мм · очень плавное движение'],['Первые признаки утра','Общий план · 16–35 мм · статично']].map(x=>({name:x[0],info:x[1],done:false,refs:[]})),sounds:[['Атмосфера ночного аэропорта','20–30 секунд чистого фонового звука; Deity D4 Duo по ситуации'],['Объявления по громкой связи','Отдельный чистый фрагмент'],['Шаги и движение людей','10–20 секунд']].map(x=>({name:x[0],info:x[1],done:false}))},{name:'Ачи-Трецца. Рассвет у скал Циклопов',info:'27 ноября · подготовка около 06:15 · DJI Osmo Action 5 Pro · таймлапс 06:30–07:00 · интервал 1 секунда · 25 fps',shots:[{name:'Рассветный таймлапс',info:'Osmo Action 5 Pro · фиксированная камера · интервал 1 сек · 06:30–07:00',done:false,refs:[]}],sounds:[{name:'Утренний прибой',info:'Записать отдельно 30 секунд',done:false}]},{name:'Аранчини и скалы Циклопов',info:'Кафе после рассвета · связать аранчини по форме со скалами',shots:[{name:'Аранчини на фоне скал',info:'Средний и крупный план · композиционное совпадение',done:false,refs:[]}],sounds:[{name:'Звуки кафе',info:'Кофейные чашки, разговоры, атмосфера',done:false}]},{name:'Рынок Катании. Фрукты в руке',info:'Серия коротких кадров по 2–3 секунды, одинаковая дистанция и композиция',shots:[{name:'Фрукт перед камерой',info:'Fuji X-S20 · 16 мм · глаза по правилу третей · смена фруктов в монтаже',done:false,refs:[]}],sounds:[{name:'Шум рынка',info:'Голоса продавцов, торг, шаги',done:false}]},{name:'Рыбный рынок и ужин',info:'Пятница — рыба-меч; суббота — групер; приготовление в квартире',shots:[{name:'Выбор рыбы на рынке',info:'Детали прилавка, руки продавца, рыба',done:false,refs:[]},{name:'Приготовление ужина',info:'Крупные планы ингредиентов и готового блюда',done:false,refs:[]}],sounds:[{name:'Атмосфера рыбного рынка',info:'Голоса и звук торговли',done:false},{name:'Звуки кухни',info:'Нож, сковорода, посуда',done:false}]}];
let data;try{data=JSON.parse(localStorage.getItem('sicily_shoot_v1'))||initial}catch(e){data=initial}let editCtx=null;const app=document.getElementById('app');function persist(){try{localStorage.setItem('sicily_shoot_v1',JSON.stringify(data))}catch(e){alert('Память браузера заполнена. Экспортируйте проект и уменьшите прикреплённые файлы.')}}function el(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){app.innerHTML=data.map((scene,si)=>{let all=[...scene.shots,...scene.sounds],count=all.filter(x=>x.done).length;return `<article><details ${si===0?'open':''}><summary><h2>Сцена ${si+1}. ${el(scene.name)}</h2><div class="muted">${el(scene.info)}</div><div class="bar"><span style="width:${all.length?100*count/all.length:0}%"></span></div><div class="muted">Выполнено ${count} из ${all.length}</div></summary><div class="inside"><div class="actions"><button class="small alt" onclick="editScene(${si})">Изменить сцену</button><button class="small alt" onclick="removeScene(${si})">Удалить сцену</button></div><div class="sectiontitle">🎥 Видео · ${scene.shots.length} кадров</div>${scene.shots.map((x,i)=>itemHTML(x,si,'shots',i)).join('')}<button class="small" onclick="addItem(${si},'shots')">+ Добавить кадр</button><div class="sectiontitle">🎙 Звук · ${scene.sounds.length} записей</div>${scene.sounds.map((x,i)=>itemHTML(x,si,'sounds',i)).join('')}<button class="small" onclick="addItem(${si},'sounds')">+ Добавить звук</button></div></details></article>`}).join('')}function itemHTML(x,si,type,i){let refs=type==='shots'?`<div class="refs">${(x.refs||[]).map((r,j)=>r.kind==='url'?`<a href="${el(r.data)}" target="_blank" rel="noopener">🔗 ${el(r.name||r.data)}</a>`:r.kind==='image'?`<a href="${r.data}" target="_blank"><img alt="${el(r.name)}" src="${r.data}"></a>`:r.kind==='video'?`<video src="${r.data}" controls></video>`:`<a href="${r.data}" download="${el(r.name)}">📎 ${el(r.name)}</a>`).map((h,j)=>`<div>${h} <button class="small alt" onclick="delRef(${si},${i},${j})">×</button></div>`).join('')}</div><div class="actions"><button class="small alt" onclick="addLink(${si},${i})">🔗 Ссылка</button><button class="small alt" onclick="document.getElementById('file-${si}-${i}').click()">📎 Фото / видео / файл</button><input id="file-${si}-${i}" type="file" accept="image/*,video/*,audio/*" multiple hidden onchange="addFiles(event,${si},${i})"></div>`:'';return `<div class="item ${x.done?'done':''}"><div class="itemhead"><input aria-label="Выполнено" type="checkbox" ${x.done?'checked':''} onchange="toggle(${si},'${type}',${i},this.checked)"><strong>${i+1}. ${el(x.name)}</strong></div><div class="meta">${el(x.info)}</div>${refs}<div class="actions"><button class="small alt" onclick="editItem(${si},'${type}',${i})">Изменить</button><button class="small alt" onclick="removeItem(${si},'${type}',${i})">Удалить</button></div></div>`}function toggle(si,t,i,v){data[si][t][i].done=v;persist();render()}function addScene(){data.push({name:'Новая сцена',info:'',shots:[],sounds:[]});persist();render();editScene(data.length-1)}function editScene(si){editCtx={si};openEditor('Сцена',data[si])}function editItem(si,t,i){editCtx={si,t,i};openEditor(t==='shots'?'Кадр':'Звук',data[si][t][i])}function addItem(si,t){data[si][t].push({name:t==='shots'?'Новый кадр':'Новый звук',info:'',done:false,...(t==='shots'?{refs:[]}:{})});persist();render();editItem(si,t,data[si][t].length-1)}function openEditor(title,o){document.getElementById('editTitle').textContent=title;document.getElementById('name').value=o.name;document.getElementById('info').value=o.info;document.getElementById('editor').showModal()}function saveEdit(){let o=editCtx.t?data[editCtx.si][editCtx.t][editCtx.i]:data[editCtx.si];o.name=document.getElementById('name').value.trim()||'Без названия';o.info=document.getElementById('info').value;persist();document.getElementById('editor').close();render()}function removeScene(si){if(confirm('Удалить сцену?')){data.splice(si,1);persist();render()}}function removeItem(si,t,i){if(confirm('Удалить пункт?')){data[si][t].splice(i,1);persist();render()}}function addLink(si,i){let url=prompt('Вставьте ссылку на фото или видео (https://...)');if(!url)return;try{let u=new URL(url);if(!['https:','http:'].includes(u.protocol))throw Error();data[si].shots[i].refs.push({kind:'url',data:url,name:url});persist();render()}catch(e){alert('Нужна корректная ссылка http(s)')}}function delRef(si,i,j){data[si].shots[i].refs.splice(j,1);persist();render()}async function addFiles(ev,si,i){for(let f of ev.target.files){if(f.size>5*1024*1024){alert('Файл '+f.name+' больше 5 МБ. Для больших видео используйте ссылку.');continue}let url=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});data[si].shots[i].refs.push({kind:f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':'file',name:f.name,data:url})}persist();render()}function exportData(){let a=document.createElement('a'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='sicily-shoot-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x)||!x.every(s=>Array.isArray(s.shots)&&Array.isArray(s.sounds)))throw Error();if(confirm('Заменить текущий план импортированным?')){data=x;persist();render()}}catch(e){alert('Неправильный файл проекта')}e.target.value=''}render();</script></body></html>
